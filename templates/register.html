{% extends 'base.html' %} {% block title %}Register — UI-ScholarHub{% endblock
%} {% block content %}
<div class="form-card">
  <h1>Create account</h1>
  <p>Use your University of Ibadan email.</p>

  <form method="post">
    <label>
      Full name
      <input name="name" required />
    </label>

    <label>
      UI email
      <input
        type="email"
        name="email"
        required
        placeholder="name@ui.edu.ng or name@dlc.ui.edu.ng"
      />
    </label>

    <label>
      Password
      <input type="password" name="password" required minlength="8" />
    </label>

    <button class="btn">Register</button>
  </form>
</div>
{% endblock %}
