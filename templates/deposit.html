{% extends 'base.html' %}{% block title %}Deposit — UI-ScholarHub{% endblock %}{% block content %}<div class="form-card wide"><h1>Deposit research output</h1><p>Your submission stays pending until a librarian reviews it.</p><form method="post" enctype="multipart/form-data"><div class="two"><label>Title<input name="title" required></label><label>Authors<input name="authors" required placeholder="Surname A.; Surname B."></label></div><label>Abstract<textarea name="abstract" rows="6" required></textarea></label><label>Keywords<input name="keywords" required placeholder="repository, information retrieval, ..."></label><div class="two"><label>Faculty<select name="faculty" required>{% for f in faculties %}<option>{{f}}</option>{% endfor %}</select></label><label>Department<input name="department" required></label></div><div class="two"><label>Output type<select name="output_type" required>{% for t in output_types %}<option>{{t}}</option>{% endfor %}</select></label><label>Year<input type="number" name="year" min="1900" max="2100" required></label></div><div class="two"><label>Access<select name="access_level"><option value="open">Open</option><option value="restricted">Restricted</option></select></label><label>File <input type="file" name="file" accept=".pdf,.doc,.docx,.txt"></label></div><button class="btn">Submit for review</button></form></div>{% endblock %}
